# Stack do site omegacsa.com.br no Monadaserver (Docker Swarm + Traefik).
#
# Deployado por infra/vps/deploy.sh — não rode `docker stack deploy` à mão:
# a imagem e as variáveis vêm exportadas pelo script.
#
# O stack se chama `omega` (e não `omegaplus`) de propósito: é o mesmo serviço
# que já serve o domínio. Atualizar no lugar evita uma janela com dois routers
# disputando o mesmo Host e mantém o `docker service rollback` funcionando.
#
# Docker 20.10 neste host: `version: "3.8"` é obrigatório (sem ela o bloco
# deploy: inteiro é ignorado em silêncio), tmpfs só na forma longa, e nada de
# interpolação `${VAR:?msg}` — a guarda mora no deploy.sh.
version: "3.8"

services:
  web:
    image: ${OMEGAPLUS_IMAGE}
    user: "node"
    read_only: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      RESEND_API_KEY: ${RESEND_API_KEY}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
      # Cache de ISR / otimização de imagens do Next. Efêmero por design.
      - type: tmpfs
        target: /app/.next/cache
        tmpfs:
          size: 268435456
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - Monadanet
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=Monadanet"
        # Domínio canônico: só ele serve conteúdo.
        - "traefik.http.routers.omega.rule=Host(`omegacsa.com.br`)"
        - "traefik.http.routers.omega.entrypoints=websecure"
        - "traefik.http.routers.omega.tls=true"
        - "traefik.http.routers.omega.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.omega.service=omega"
        - "traefik.http.services.omega.loadbalancer.server.port=3000"
        # www e domínios antigos: 301 para o canônico, preservando caminho e query.
        # Um router por host (não Host(a) || Host(b)): o desafio ACME é por
        # domínio, e DNS faltando num deles não derruba o certificado dos outros.
        # `$$` escapa a interpolação do stack file — o Traefik precisa receber `${1}`.
        - "traefik.http.middlewares.omega-canonico.redirectregex.regex=^https?://[^/]+(.*)$$"
        - "traefik.http.middlewares.omega-canonico.redirectregex.replacement=https://omegacsa.com.br$${1}"
        - "traefik.http.middlewares.omega-canonico.redirectregex.permanent=true"
        - "traefik.http.routers.omega-www.rule=Host(`www.omegacsa.com.br`)"
        - "traefik.http.routers.omega-www.entrypoints=websecure"
        - "traefik.http.routers.omega-www.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.omega-www.middlewares=omega-canonico"
        - "traefik.http.routers.omega-www.service=omega"
        - "traefik.http.routers.omega-legado1.rule=Host(`omega.autozapx.com`)"
        - "traefik.http.routers.omega-legado1.entrypoints=websecure"
        - "traefik.http.routers.omega-legado1.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.omega-legado1.middlewares=omega-canonico"
        - "traefik.http.routers.omega-legado1.service=omega"
        - "traefik.http.routers.omega-legado2.rule=Host(`omegacsa.autozapx.com`)"
        - "traefik.http.routers.omega-legado2.entrypoints=websecure"
        - "traefik.http.routers.omega-legado2.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.omega-legado2.middlewares=omega-canonico"
        - "traefik.http.routers.omega-legado2.service=omega"

networks:
  Monadanet:
    external: true
